stages:
  - build
  - test
  - deploy


.default_matrix: &r_matrix
  parallel:
    matrix:
      - ENV_LABEL: "R-default"
        R_BIN: "R"
        R_LIBS_USER: "/home/group/public/894cf/.R/4.2.0/library"
        RSCRIPT_BIN: "Rscript"
      
      - ENV_LABEL: "R-4.4.2"
        R_BIN: "R-4.4.2"
        R_LIBS_USER: "/home/group/public/894cf/.R/4.4.2/library"
        RSCRIPT_BIN: "Rscript-4.4.2"

      - ENV_LABEL: "R-4.5.0"
        R_BIN: "R-4.5.0"
        R_LIBS_USER: "/home/group/public/894cf/.R/4.5.0/library"
        RSCRIPT_BIN: "/home/group/public/894cf/cellar/R/4.5.0/bin/Rscript"
  variables:
    GIT_CLONE_PATH: "$CI_BUILDS_DIR/$CI_JOB_NAME"

  before_script:
    - |
      mkdir -p ${R_LIBS_USER}
      echo "ENV_LABEL: ${ENV_LABEL}"
      echo "R_BIN: ${R_BIN}"
      echo "RSCRIPT_BIN: ${RSCRIPT_BIN}"
      echo "R_LIBS_USER: ${R_LIBS_USER}"
      echo " ------- ENV --------"
      echo "PATH: ${PATH}"


building:
  extends: .default_matrix
  stage: build
  #tags:
  #  - collaudo
  script:
    - |
      echo "Using R_BIN=${R_BIN}"
      echo "Using RSCRIPT_BIN=${RSCRIPT_BIN}"
      echo "Using R_LIBS_USER=${R_LIBS_USER}"
    - make check

# To have the coverage percentage appear as a gitlab badge follow these
# instructions:
# https://docs.gitlab.com/ee/user/project/pipelines/settings.html#test-coverage-parsing
# The coverage parsing string is
# Coverage: \d+\.\d+

testing:
  extends: .default_matrix
  stage: test
  allow_failure: true
  when: on_success
  #tags:
  #  - collaudo
  #only:
  #  - main
  script:
    - make test

install:
  extends: .default_matrix
  stage: deploy
  needs:
    - building
  #tags:
  #  - prod
  allow_failure: false
  when: on_success
  script:
    - make install
  only:
    - tags

coverage:
  extends: .default_matrix
  stage: test
  #tags:
  #  - collaudo
  needs:
    - building
  allow_failure: true
  when: on_success
  #only:
  #  - main
  script:
    - make coverage

zero_coverage:
  extends: .default_matrix
  stage: test
  needs:
    - building
  #  - coverage
  allow_failure: true
  when: on_success
  # only:
  #  - main
  script:
    - make zero_coverage
